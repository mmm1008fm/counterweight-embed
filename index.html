<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counterweight · Playable Embed</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --soot: #161412;
      --coal: #1d1b18;
      --iron: #2e2b27;
      --rule: #3a3631;
      --paper: #eee6d3;
      --dim: #aaa494;
      --mute: #8a8478;
      --brass: #d9b665;
      --red: #ad1d18;
      --sans: "Fira Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      --cond: "Fira Sans Extra Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--soot);
      color: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0c0b;
    }
    #unity-fullscreen-container {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: var(--soot);
      overflow: hidden;
    }
    #unity-fullscreen-container:fullscreen {
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--soot);
      outline: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    /* Pixel-exact menu poster shown before and during load */
    #poster {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
      transition: opacity .5s ease, visibility 0s linear .5s;
    }

    /* Click-to-play & loading overlay */
    #cover {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: radial-gradient(ellipse at center, rgba(22, 20, 18, 0.58) 0%, rgba(15, 14, 13, 0.82) 100%);
      cursor: pointer;
      transition: opacity .5s ease, visibility 0s linear .5s, background .25s ease;
    }
    body.is-loading #cover {
      justify-content: flex-end;
      padding-bottom: 4.5%;
      cursor: progress;
      background: linear-gradient(0deg, rgba(22, 20, 18, 0.9) 0%, rgba(22, 20, 18, 0) 26%);
    }
    body.is-ready #cover,
    body.is-ready #poster {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    body.is-error #cover {
      cursor: default;
      background: rgba(22, 20, 18, 0.94);
    }

    .gate-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 22px 28px;
      background: rgba(22, 20, 18, 0.92);
      border: 1px solid var(--brass);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      transition: transform .12s ease, border-color .15s ease;
    }
    #cover:hover .gate-card {
      border-color: var(--paper);
      transform: translateY(-1px);
    }
    body.is-loading .gate-card,
    body.is-error .gate-card,
    body.is-touch .gate-card {
      display: none;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 46px;
      padding: 0 28px;
      border: 0;
      background: var(--brass);
      color: var(--soot);
      font: 700 16px/1 var(--cond);
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    #cover:hover .play-btn,
    .play-btn:hover {
      background: var(--paper);
    }
    .play-tri {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 10px solid currentColor;
    }
    .gate-sub {
      color: var(--dim);
      font-size: 13px;
      letter-spacing: .03em;
    }

    #status {
      display: none;
      max-width: 48ch;
      color: var(--paper);
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: .03em;
      font-variant-numeric: tabular-nums;
    }
    body.is-loading #status,
    body.is-error #status {
      display: block;
    }
    #status a {
      color: var(--brass);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Progress bar at bottom of 16:9 stage */
    #progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      height: 3px;
      background: var(--iron);
      opacity: 0;
      transition: opacity .25s ease;
    }
    #progress > i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--brass);
      transition: width .2s ease;
    }
    body.is-loading #progress { opacity: 1; }

    /* In-game transition stall ("Loading" between menu and shaft) */
    #stall {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14%;
      z-index: 4;
      display: none;
      pointer-events: none;
      color: var(--dim);
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-align: center;
    }
    #stall.is-on { display: block; }

    /* Touch-only message */
    #touch {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      background: rgba(22, 20, 18, 0.88);
      text-align: center;
    }
    body.is-touch #touch { display: flex; }
    body.is-touch #cover { display: none; }
    #touch p {
      margin: 0;
      max-width: 36ch;
      color: var(--paper);
      font-size: 15px;
      line-height: 1.45;
    }
    #touch small {
      color: var(--dim);
      font-size: 13px;
    }

    /* Subtle hover fullscreen button inside frame (hidden when ?nofs=1) */
    #fs-corner {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      display: none;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--rule);
      background: rgba(22, 20, 18, 0.78);
      color: var(--dim);
      font: 600 11px/1 var(--sans);
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      transition: opacity .2s ease, color .15s ease, border-color .15s ease;
    }
    body.is-ready:not(.no-fs) #unity-fullscreen-container:hover #fs-corner,
    #fs-corner:focus-visible {
      opacity: 1;
    }
    body.is-ready:not(.no-fs) #fs-corner { display: inline-flex; }
    #fs-corner:hover { color: var(--paper); border-color: var(--brass); }
    #unity-fullscreen-container:fullscreen #fs-corner { display: none; }

    /* Non-blocking warning banner */
    #warning {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 6;
      display: none;
      pointer-events: none;
    }
    #warning div {
      background: var(--paper);
      color: var(--soot);
      padding: 8px 12px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    #warning div.error {
      background: var(--red);
      color: var(--paper);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="unity-fullscreen-container">
      <canvas id="unity-canvas" width="960" height="540" tabindex="-1" aria-label="Counterweight"></canvas>
      <img id="poster" src="poster_menu.png" width="480" height="270" alt="Counterweight">

      <div id="cover">
        <div class="gate-card">
          <button class="play-btn" id="start-btn" type="button">
            <span class="play-tri" aria-hidden="true"></span>
            <span id="start-label">Играть прямо на странице</span>
          </button>
          <span class="gate-sub" id="gate-sub">В браузере · ~7 МБ · нужна мышь</span>
        </div>
        <div id="status" aria-live="polite"></div>
      </div>

      <div id="progress"><i id="bar-fill"></i></div>
      <div id="stall" aria-live="polite">Загрузка…</div>

      <div id="touch" role="region" aria-label="Нужна мышь">
        <p id="touch-title">Игре нужна мышь — она запускается на компьютере.</p>
        <small id="touch-sub">Откройте эту страницу с ПК или ноутбука, чтобы сыграть в браузере.</small>
      </div>

      <button id="fs-corner" type="button" title="Полный экран">⛶ Полный экран</button>
      <div id="warning"></div>
    </div>
  </div>

  <script>
    (function () {
      var sp = new URLSearchParams(location.search);
      var en = (sp.get("lang") || "").toLowerCase() === "en";
      var autostart = sp.get("autostart") === "1";
      var nofs = sp.get("nofs") === "1";
      if (nofs) document.body.classList.add("no-fs");
      if (en) {
        document.documentElement.lang = "en";
        document.getElementById("start-label").textContent = "Play in browser";
        document.getElementById("gate-sub").textContent = "~7 MB · mouse required";
        document.getElementById("stall").textContent = "Loading…";
        document.getElementById("touch-title").textContent = "This game requires a mouse and runs on a computer.";
        document.getElementById("touch-sub").textContent = "Open this page on a desktop or laptop to play.";
        document.getElementById("fs-corner").textContent = "⛶ Fullscreen";
      }

      function T(ru, enStr) { return en ? enStr : ru; }

      function notifyParent(event, extra) {
        if (window.parent === window) return;
        var msg = { type: "cw-embed", event: event };
        if (extra) { for (var k in extra) msg[k] = extra[k]; }
        try { window.parent.postMessage(msg, "*"); } catch (e) {}
      }

      // Wrap AudioContext so off-screen scrolling / tab switch / parent mute cleanly suspends game audio
      var gameAudio = [];
      var visible = true, mutedByParent = false, paused = false;
      function audioAllowed() {
        return (visible || !!document.fullscreenElement) && !paused && !mutedByParent && document.visibilityState !== "hidden";
      }
      function syncAudio() {
        var on = audioAllowed();
        for (var i = 0; i < gameAudio.length; i++) {
          var c = gameAudio[i];
          try {
            if (on) c.__cwResume().catch(function () {});
            else if (c.state === "running") c.suspend().catch(function () {});
          } catch (e) {}
        }
      }
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !window.__cwAudioWrap) {
        window.__cwAudioWrap = true;
        var WrappedAC = function () {
          var ctx = new (Function.prototype.bind.apply(AC, [null].concat(Array.prototype.slice.call(arguments))))();
          var origResume = AC.prototype.resume.bind(ctx);
          ctx.__cwResume = origResume;
          ctx.resume = function () { return audioAllowed() ? origResume() : Promise.resolve(); };
          gameAudio.push(ctx);
          if (!audioAllowed()) ctx.suspend().catch(function () {});
          return ctx;
        };
        WrappedAC.prototype = AC.prototype;
        window.AudioContext = WrappedAC;
        if (window.webkitAudioContext) window.webkitAudioContext = WrappedAC;
      }

      var canvas = document.getElementById("unity-canvas");
      var fsContainer = document.getElementById("unity-fullscreen-container");
      var cover = document.getElementById("cover");
      var statusEl = document.getElementById("status");
      var barFill = document.getElementById("bar-fill");
      var stallEl = document.getElementById("stall");
      var fsBtn = document.getElementById("fs-corner");

      var state = "idle"; // idle | loading | ready | error | touch
      var unityInstance = null;
      var readyAt = 0, pauseTimer = 0;

      // Right mouse button = brake; wheel = shaft map. Keep both inside the iframe so parent page never scrolls.
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      window.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
      canvas.addEventListener("pointerdown", function () { canvas.focus({ preventScroll: true }); });

      // Touch-only check (desktops with touchscreen still have any-pointer: fine and play normally)
      var mm = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
      var touchOnly = mm("(pointer: coarse)") && !mm("(any-pointer: fine)");
      window.cwTouchOnly = touchOnly;

      // Bridges called by CwPage.jslib / CwTrack.jslib inside WASM
      window.cwWarm = function () {};
      window.cwTrack = function (name, data) {
        notifyParent("track", { name: name, data: data || {} });
      };
      window.cwOnStage = function (s) {
        stallEl.classList.toggle("is-on", s === "loading");
        notifyParent("stage", { stage: s });
      };

      function setState(s) {
        state = s;
        document.body.classList.toggle("is-loading", s === "loading");
        document.body.classList.toggle("is-ready", s === "ready");
        document.body.classList.toggle("is-error", s === "error");
        document.body.classList.toggle("is-touch", s === "touch");
        notifyParent("state", { state: s });
      }

      if (touchOnly) {
        setState("touch");
      }

      function hasWebGL2() {
        try {
          var gl = document.createElement("canvas").getContext("webgl2");
          if (!gl) return false;
          var ext = gl.getExtension("WEBGL_lose_context");
          if (ext) ext.loseContext();
          return true;
        } catch (e) { return false; }
      }

      function showBanner(msg, type) {
        if (type === "error") {
          fail(msg);
          return;
        }
        var w = document.getElementById("warning");
        var d = document.createElement("div");
        d.textContent = String(msg);
        w.appendChild(d);
        w.style.display = "block";
        setTimeout(function () {
          if (d.parentNode) d.parentNode.removeChild(d);
          if (!w.children.length) w.style.display = "none";
        }, 5000);
      }

      function fail(detail, noWebGL) {
        if (detail) console.error("[Counterweight]", detail);
        if (state === "ready") return;
        setState("error");
        statusEl.innerHTML = noWebGL
          ? T("В этом браузере отключён WebGL 2. Откройте страницу в свежем Chrome, Edge или Firefox или скачайте версию для Windows на <a href='https://morning-tea-studio.itch.io/counterweight' target='_blank' rel='noopener'>itch.io</a>.",
              "WebGL 2 is unavailable in this browser. Open in Chrome, Edge, or Firefox, or get the Windows build on <a href='https://morning-tea-studio.itch.io/counterweight' target='_blank' rel='noopener'>itch.io</a>.")
          : T("Не удалось загрузить файлы игры. Обновите страницу или откройте полную версию на <a href='https://coolguy.live/ld60/' target='_blank' rel='noopener'>coolguy.live/ld60</a>.",
              "Could not load game files. Reload the page or open <a href='https://coolguy.live/ld60/' target='_blank' rel='noopener'>coolguy.live/ld60</a>.");
      }

      function setProgress(p) {
        var pc = Math.max(0, Math.min(100, Math.round(p * 100)));
        barFill.style.width = pc + "%";
        if (state === "loading") {
          statusEl.textContent = T("Загрузка ", "Loading ") + pc + "%";
        }
      }

      function goFullscreen() {
        if (unityInstance && typeof unityInstance.SetFullscreen === "function") {
          unityInstance.SetFullscreen(1);
        } else if (fsContainer.requestFullscreen) {
          fsContainer.requestFullscreen().catch(function () {});
        }
      }
      fsBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        goFullscreen();
      });

      function startGame() {
        if (state === "touch" || state === "loading" || state === "ready") return;
        if (!hasWebGL2()) {
          fail("WebGL 2 missing", true);
          return;
        }
        setState("loading");
        setProgress(0);
        notifyParent("start");

        var buildUrl = "Build";
        var config = {
          arguments: [],
          dataUrl: buildUrl + "/WebGL_Embed.data.unityweb",
          frameworkUrl: buildUrl + "/WebGL_Embed.framework.js.unityweb",
          codeUrl: buildUrl + "/WebGL_Embed.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          fullscreenElementID: "unity-fullscreen-container",
          companyName: "DefaultCompany",
          productName: "Counterweight",
          productVersion: "1.0",
          showBanner: showBanner,
          errorHandler: function (err) {
            console.error("[Counterweight runtime]", err);
            return true;
          }
        };

        var script = document.createElement("script");
        script.src = buildUrl + "/WebGL_Embed.loader.js";
        script.onload = function () {
          createUnityInstance(canvas, config, setProgress).then(function (inst) {
            unityInstance = inst;
            window.cwUnity = inst;
            setProgress(1);
            setState("ready");
            readyAt = Date.now();
            if (window.cwStage && window.cwOnStage) window.cwOnStage(window.cwStage);
            canvas.focus({ preventScroll: true });
            syncAudio();
            notifyParent("ready");
          }).catch(function (m) { fail(m, false); });
        };
        script.onerror = function () { fail("loader failed", false); };
        document.body.appendChild(script);
      }

      cover.addEventListener("click", function (e) {
        if (e.target.closest("a")) return;
        startGame();
      });
      document.getElementById("start-btn").addEventListener("click", function (e) {
        e.stopPropagation();
        startGame();
      });

      // Pause main loop & audio when scrolled out of top-level viewport (after 20s shader warm-up)
      function setPaused(p) {
        if (!unityInstance || p === paused) return;
        var M = unityInstance.Module || {};
        try {
          if (p) { if (M.pauseMainLoop) M.pauseMainLoop(); }
          else { if (M.resumeMainLoop) M.resumeMainLoop(); }
          paused = p;
        } catch (e) {}
        syncAudio();
      }
      function updateVisibility() {
        syncAudio();
        if (!unityInstance || state !== "ready") return;
        clearTimeout(pauseTimer);
        if (document.fullscreenElement || document.visibilityState === "hidden") {
          setPaused(document.visibilityState === "hidden" && !document.fullscreenElement);
          return;
        }
        var wait = 20000 - (Date.now() - readyAt);
        if (!visible && wait > 0) {
          pauseTimer = setTimeout(function () { setPaused(!visible && !document.fullscreenElement); }, wait);
        } else {
          setPaused(!visible);
        }
      }
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          visible = entries[0].isIntersecting;
          updateVisibility();
        }, { threshold: 0.1 }).observe(fsContainer);
      }
      document.addEventListener("visibilitychange", updateVisibility);
      document.addEventListener("fullscreenchange", updateVisibility);

      // Commands from parent Tilda wrapper
      window.addEventListener("message", function (e) {
        var d = e && e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "cw:start") startGame();
        else if (d.type === "cw:fullscreen") goFullscreen();
        else if (d.type === "cw:mute") { mutedByParent = !!d.muted; syncAudio(); }
      });

      if (autostart && !touchOnly) {
        startGame();
      }
    })();
  </script>
</body>
</html>
